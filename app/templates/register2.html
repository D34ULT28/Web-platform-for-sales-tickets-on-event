  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <main>
    <h1 class="page-title">Регистрация продавца билетов</h1>
    <p class="step-label">Шаг 2 из 3</p>

    <!-- Индикатор шагов -->
    <div class="steps-indicator">
      <div class="step-dot done"></div>
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
    </div>

    <div class="form-container">
      <div class="form-grid">

        <!-- Название аккаунта -->
        <div class="field-group">
          <label class="field-label" for="account_name">Название аккаунта:</label>
          <input type="text" id="account_name" class="field-input" placeholder=""/>
        </div>

        <!-- Логин -->
        <div class="field-group">
          <label class="field-label" for="username">Логин:</label>
          <input type="text" id="username" class="field-input" placeholder=""/>
        </div>

        <!-- Город -->
        <div class="field-group">
          <label class="field-label" for="city">Город:</label>
          <div class="select-wrapper">
            <select id="city" class="field-select">
              <option value="" disabled selected>— Выберите город —</option>
              <option value="moscow">Москва</option>
              <option value="spb">Санкт-Петербург</option>
              <option value="novosibirsk">Новосибирск</option>
              <option value="ekb">Екатеринбург</option>
              <option value="kazan">Казань</option>
              <option value="chelyabinsk">Челябинск</option>
              <option value="omsk">Омск</option>
              <option value="samara">Самара</option>
              <option value="other">Другой</option>
            </select>
            <span class="select-arrow">&#8964;</span>
          </div>
        </div>

        <!-- Пароль -->
        <div class="field-group">
          <label class="field-label" for="password">Пароль:</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="field-input" placeholder=""/>
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <svg id="eye-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Вы организовываете -->
        <div class="field-group">
          <label class="field-label" for="organizes">Вы организовываете:</label>
          <input type="text" id="organizes" class="field-input" placeholder=""/>
        </div>

        <!-- Среднее кол-во посетителей -->
        <div class="field-group">
          <label class="field-label" for="avg_visitors">Среднее кол-во посетителей:</label>
          <input type="number" id="avg_visitors" class="field-input" placeholder=""/>
        </div>

      </div>

      <button class="btn-continue" onclick="handleNext()">ПРОДОЛЖИТЬ →</button>
    </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.style.stroke = '#1dc8a8';
      } else {
        input.type = 'password';
        icon.style.stroke = '#888';
      }
    }

    async function handleNext() {
      const fields = ['account_name', 'username', 'city', 'password'];
      let valid = true;
      fields.forEach(id => {
        const el = document.getElementById(id);
        if (!el || !el.value.trim()) {
          if (el) el.classList.add('error');
          valid = false;
        }
      });
      if (!valid) return;

      const email    = sessionStorage.getItem('reg_email') || '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const city     = document.getElementById('city').value;

      if (!email) {
        alert('Вернитесь на шаг 1 и введите email');
        window.location.href = '../templates/register.html';
        return;
      }

      const btn = document.querySelector('.btn-continue');
      btn.textContent = 'Регистрация...';
      btn.disabled = true;

      try {
        const res = await fetch('http://127.0.0.1:8000/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email:    email,
            username: username,
            password: password,
            role:     'organizer',
            city:     city
          })
        });

        const data = await res.json();

        if (res.ok) {
          // Сразу логинимся чтобы получить токен
          const loginRes = await fetch('http://127.0.0.1:8000/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
          });
          const loginData = await loginRes.json();
          if (loginRes.ok) {
            localStorage.setItem('token', loginData.access_token);
            localStorage.setItem('username', username);
          }
          sessionStorage.setItem('reg_username', username);
          window.location.href = '../templates/dashboard.html';
        } else {
          showError(data.detail || 'Ошибка регистрации');
          btn.textContent = 'ПРОДОЛЖИТЬ →';
          btn.disabled = false;
        }
      } catch(e) {
        // Нет соединения — всё равно переходим (демо)
        sessionStorage.setItem('reg_username', username);
        window.location.href = '../templates/dashboard.html';
      }
    }

    function showError(msg) {
      const old = document.querySelector('.reg-error');
      if (old) old.remove();
      const err = document.createElement('div');
      err.className = 'reg-error';
      err.style.cssText = 'color:#e74c3c;font-size:13px;margin-top:10px;text-align:center;';
      err.textContent = msg;
      document.querySelector('.btn-continue').after(err);
    }

    // Убираем ошибку при вводе
    document.querySelectorAll('.field-input, .field-select').forEach(el => {
      el.addEventListener('input', function() {
        this.classList.remove('error');
      });
    });
  </script>
